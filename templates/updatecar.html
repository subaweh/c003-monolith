{% include 'header.html' %}
  <body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <h1>{{ appType }} | Car Project</h1>
        <h3>Demo:
          <a href="{{ url_for('createcar') }}">Create</a> /
          <a href="{{ url_for('readcar') }}">Read</a> /
          <a href="{{ url_for('updatecar') }}">Update</a> /
          <a href="{{ url_for('deletecar') }}">Delete</a> /
          <a href="{{ url_for('searchcar') }}">Search</a>
        </h3>
      </div>
    </div>
    <br>
    <div class="row">
      <div class="col-md-12">
        <h4>Update Car Data</h4>
        <form role="form" action="{{ url_for('updatecarsave') }}" method="POST">
          <div class="form-group">
            <label>Car Name (Target yang akan diubah)</label>
            <input type="text" class="form-control" name="carName" placeholder="Masukkan Car Name yang ingin di-update" required>
          </div>
          <div class="form-group">
            <label>New Car Brand</label>
            <input type="text" class="form-control" name="carBrand" placeholder="Masukkan Brand Baru" required>
          </div>
          <div class="form-group">
            <label>New Car Model</label>
            <input type="text" class="form-control" name="carModel" placeholder="Masukkan Model Baru" required>
          </div>
          <div class="form-group">
            <label>New Car Price</label>
            <input type="text" class="form-control" name="carPrice" placeholder="Masukkan Harga Baru" required>
          </div>
          <button type="submit" class="btn btn-primary">Update</button>
        </form>
      </div>
    </div>
  </div>
{% include 'footer.html' %}
